{% extends "base.html" %}
{% block title %}MealPrep{% endblock %}

{% block before_main %}
<div id="loading-overlay" class="loading-overlay" style="display:none">
  <div class="spinner"></div>
</div>
{% endblock %}

{% block main_attrs %} id="app"{% endblock %}

{% block content %}
<p style="color:var(--fg-muted)">Lade Dashboard...</p>
{% endblock %}

{% block after_main %}
<!-- Swap Modal -->
<div id="swap-modal" class="modal-overlay" style="display:none">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Rezept tauschen</h2>
      <button class="modal-close" onclick="closeSwapModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-filter">
      <label>
        <input type="checkbox" id="filter-feasible" checked onchange="renderSwapGrid()">
        Nur machbare
      </label>
    </div>
    <div id="swap-grid" class="swap-grid"></div>
  </div>
</div>

<!-- Adhoc Intake Modal -->
<div id="adhoc-modal" class="modal-overlay" style="display:none">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Mahlzeit eintragen</h2>
      <button class="modal-close" onclick="closeAdhocModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="adhoc-tab-btns" style="display:flex;gap:0.5rem;margin-bottom:1rem">
      <button class="tab-btn active" data-action="adhoc-tab" data-adhoc-tab="manual">Manuell</button>
      <button class="tab-btn" data-action="adhoc-tab" data-adhoc-tab="recipe">Rezept suchen</button>
    </div>
    <div id="adhoc-body"></div>
  </div>
</div>
{% endblock %}
